# The self-hosted stack with the Django API in place of the Node API
# (docs/django-migration/deployment.md).
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.django.yml \
#     --env-file deploy/.env up -d --build
#
# Only the `api` service changes. Everything else is deploy/docker-compose.yml
# as it is: the same database and volumes, the same `migrate` service (the
# SQL ledger and the API's database role, run from the Node image), the same
# web apps, web server and nightly backup, and the same deploy/.env. The two
# APIs read the same variables and the same schema, so going back to the Node
# API is the same command without this file (the rollback).

services:
  api:
    build:
      context: ../backend/django
    image: medlivebd-api-django
    volumes:
      - files:/data/files

  # The operator's commands that are Node scripts (`pnpm staff:create`,
  # `pnpm doctor:verify`, `pnpm staff:reset-2fa`; DEPLOY.md S3). With the Node
  # API they ran in the `api` container; the Django one has no pnpm, so they
  # run here, from the image the `migrate` service built, with the API's
  # variables and its database role. Only when asked for:
  #
  #   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.django.yml \
  #     --env-file deploy/.env run --rm tools pnpm staff:create ...
  tools:
    image: medlivebd-api
    profiles: ["tools"]
    env_file: .env
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      DATABASE_URL: postgresql://${API_DB_USER}:${API_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      API_BASE_URL: ${API_ORIGIN}
      WEB_BASE_URL: ${APP_ORIGIN}
      CONSOLE_BASE_URL: ${CONSOLE_ORIGIN}
      STORAGE_PROVIDER: local
      STORAGE_DIR: /data/files
    volumes:
      - files:/data/files
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    healthcheck: { disable: true }
