# Continuous integration.
#
# BACKEND.md §11 fixes the gates: typecheck, lint (the layering rule), unit,
# API, one E2E smoke, and db:verify. They are added to this file by the step
# that makes each one meaningful, and none is ever removed:
#
#   step 1  feat/db-core            → Postgres service, schema suite, db:verify  ✓
#   step 2  feat/domain-queue       → reducer and replay-determinism units
#   step 3  feat/api-foundation     → Supertest auth-matrix suite              ✓
#   step 7  feat/ui-tokens          → a11y checks, bn/en message-key parity (I18N-02)
#   step 10 feat/patient-live-serial → the two-device queue E2E smoke, which is
#                                      the product's canary and is never skipped
#                                      or marked flaky (CLAUDE.md §6)
#   plan 1.8 chore/e2e-ci           → the build, the whole browser suite with
#                                      the canary first, and the same canary
#                                      against the production configuration  ✓
#
# Until plan 1.8 the browser suite ran only when somebody remembered to run it
# on their own machine, and never against what a hospital runs. Three jobs now:
#
#   verify           typecheck, lint, format, unit, API and schema tests
#   browser          the build; the canary; the whole suite; the console built
#   production       the canary and the counter against NODE_ENV=production,
#                    DEMO_MODE=false, the limited database role, built apps

name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:
    branches: [main, mvp]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Node 24 is the deployment runtime (BACKEND.md §0); CI matches production.
  #
  # It was 20 until the test run failed on every push from step 7 onward:
  # jsdom 30 depends on undici 8, which requires Node 22.19 or later, so the
  # four jsdom-backed UI test files could not even start their worker. Every
  # test that did run passed, which is why it looked like noise rather than a
  # red build. Node 20 also left support in April 2026. `engines` in
  # package.json states the real floor.
  NODE_VERSION: "24"

jobs:
  verify:
    name: typecheck · lint · format · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # PostGIS rather than plain Postgres: 0001_extensions.sql installs postgis
      # and earthdistance for the emergency geo search (DATABASE.md §6). Same
      # image and version as docker-compose.yml, so a schema failure in CI can
      # be reproduced locally exactly.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: healthcare
          POSTGRES_DB: healthcare_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthcare -d healthcare_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://healthcare:healthcare@localhost:5432/healthcare_dev
      DATABASE_URL_TEST: postgresql://healthcare:healthcare@localhost:5432/healthcare_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pnpm version is pinned by the `packageManager` field in
      # package.json, so corepack installs exactly what developers run.
      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Includes the architectural boundaries: routes → controllers → services
      # → repositories → db, the purity of shared/domain, and SQL confined to
      # repositories (BACKEND.md §3, CLAUDE.md §7).
      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      # The service container creates only healthcare_dev. Two more disposable
      # databases are needed — one per suite, because the API suite mutates the
      # demo data while the schema suite asserts on exact counts of it.
      #
      # `buildTestDatabase` creates either if it is missing, so this step is
      # not strictly required; it is here because a database the workflow
      # creates explicitly is one a reader of the workflow knows about.
      # Locally, docker-compose.yml creates all three on a container's *first*
      # start — and only its first, which is why the runtime check exists at
      # all: a volume predating a new database would otherwise fail the same
      # way CI did.
      - name: Create the test databases
        run: |
          PGPASSWORD=healthcare psql \
            -h localhost -U healthcare -d healthcare_dev \
            -c 'CREATE DATABASE healthcare_test OWNER healthcare' \
            -c 'CREATE DATABASE healthcare_api_test OWNER healthcare'

      - name: Migrate
        run: pnpm db:migrate

      # DATABASE.md §0 invariants: RLS on every table, created_at/updated_at
      # maintained, UTC timestamps, integer poisha, normalised phones, and the
      # append-only guards on queue_events.
      - name: Verify schema invariants
        run: pnpm db:verify

      # Three projects: the pure domain units, the Supertest auth matrix, and
      # the schema suite that rebuilds healthcare_test from scratch to prove
      # the migrations apply to a fresh database.
      - name: Test
        run: pnpm test

  # ---------------------------------------------------------------------------
  # The browser suite (CLAUDE.md §6), against the demonstration: `next dev`,
  # DEMO_MODE=true. The canary runs first and by itself, so that when the
  # product's one promise is broken it is the first thing the run says, not
  # line 129 of 150.
  # ---------------------------------------------------------------------------
  browser:
    name: build · canary · browser suite
    runs-on: ubuntu-latest
    timeout-minutes: 75

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: healthcare
          POSTGRES_DB: healthcare_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthcare -d healthcare_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite rebuilds this database from the seeds on every run
      # (e2e/support/globalSetup.ts). Demonstration data only (FR-SEC-08).
      DATABASE_URL: postgresql://healthcare:healthcare@localhost:5432/healthcare_dev
      E2E_DATABASE_URL: postgresql://healthcare:healthcare@localhost:5432/healthcare_dev
      DEMO_MODE: "true"
      SMS_PROVIDER: log
      PAYMENT_PROVIDER: mock
      TRAVEL_TIME_MODE: static
      # Obviously fake, and used by nothing but this run: the specs sign their
      # own staff tokens and the API has to accept them.
      JWT_ACCESS_SECRET: ci-only-access-secret-not-a-real-credential
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-credential
      GUEST_LINK_SECRET: ci-only-guest-link-secret-not-a-real-credential
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Both apps as a deployment builds them. A page that only fails to build
      # for production is otherwise found on the day of the deployment.
      - name: Build
        run: pnpm build

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # First, alone, and never optional (CLAUDE.md §6, §11.4).
      - name: The canary — a reception tap reaches the patient in two seconds
        run: pnpm test:e2e e2e/two-device-queue.spec.ts

      - name: The whole browser suite
        run: pnpm test:e2e

      - name: The console as built (offline reload)
        run: pnpm test:e2e:built

      - name: Keep what a failure left behind
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-suite-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The production configuration (playwright.prod.config.ts): what a hospital
  # runs. NODE_ENV=production, DEMO_MODE=false, the API connected as the role
  # that owns nothing, both apps built. The canary in its production form, and
  # the counter's own specs unchanged.
  # ---------------------------------------------------------------------------
  production:
    name: production configuration · canary and the counter
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: healthcare
          POSTGRES_DB: healthcare_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthcare -d healthcare_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # For the seeding only, which refuses without DEMO_MODE=true. The API
      # this job tests is given its own environment, stated in full in
      # e2e/support/production.ts, and that one says DEMO_MODE=false.
      DATABASE_URL: postgresql://healthcare:healthcare@localhost:5432/healthcare_dev
      E2E_DATABASE_URL: postgresql://healthcare:healthcare@localhost:5432/healthcare_dev
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: The canary and the counter, against the production configuration
        run: pnpm test:e2e:prod

      - name: Keep what a failure left behind
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-configuration-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
