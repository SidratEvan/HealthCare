[project]
name = "medlive-api"
version = "0.1.0"
description = "MedLiveBD API on Django and Django REST Framework (port of backend/api)."
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "medlive.test_settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
  "db: needs the local test database (env/test.env)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
